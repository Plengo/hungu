# ─── Host nginx reverse proxy — hungu.co.za ───────────────────────────────────
#
# This file lives in the repo at services/web/nginx.host.conf and is deployed
# to /etc/nginx/sites-available/hungu.co.za on the server.
#
# Every site on this server gets its own file here. Add a second site by:
#   1. Creating /etc/nginx/sites-available/newsite.co.za with its server blocks
#   2. ln -s /etc/nginx/sites-available/newsite.co.za /etc/nginx/sites-enabled/
#   3. nginx -t && systemctl reload nginx
#
# Requirements (handled by scripts/setup-ssl.sh):
#   - nginx installed on host  (apt install nginx)
#   - cert at /etc/letsencrypt/live/hungu.co.za/  (certbot certonly)
#   - this file symlinked into /etc/nginx/sites-enabled/
# ─────────────────────────────────────────────────────────────────────────────

# HTTP — redirect everything to HTTPS; allow ACME challenge through
server {
    listen 80;
    server_name hungu.co.za www.hungu.co.za;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — terminate SSL, proxy to hungu container on localhost:3000
server {
    listen 443 ssl;
    server_name hungu.co.za www.hungu.co.za;

    ssl_certificate     /etc/letsencrypt/live/hungu.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hungu.co.za/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Forward to the hungu web container (bound to localhost:3000)
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        keep-alive;
    }
}
