# HTTP — redirect all to HTTPS, except Let's Encrypt challenge
server {
    listen 80;
    server_name hungu.co.za www.hungu.co.za;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name hungu.co.za www.hungu.co.za;

    ssl_certificate     /etc/letsencrypt/live/hungu.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hungu.co.za/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the FastAPI container
    location /api/ {
        proxy_pass         http://api:8000/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    # SPA — serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
