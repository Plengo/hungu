# Container-internal nginx config (prod mode)
# SSL is handled by the host nginx reverse proxy — this container only sees
# plain HTTP on port 80 from localhost. X-Forwarded-Proto tells the app
# that the original client connection was HTTPS.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the FastAPI container (internal Docker network)
    location /api/ {
        proxy_pass         http://api:8000/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    # SPA — serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
