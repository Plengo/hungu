# Container-internal nginx config (prod mode)
# SSL is handled by the host nginx reverse proxy — this container only sees
# plain HTTP on port 80 from localhost. X-Forwarded-Proto tells the app
# that the original client connection was HTTPS.
server {
    listen 80;
    server_name _;

    # Docker's internal DNS resolver — required so nginx resolves upstream
    # names lazily at request time instead of failing hard at startup when
    # sibling containers may not yet be registered in Docker DNS.
    resolver 127.0.0.11 valid=10s;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the FastAPI container (internal Docker network)
    location /api/ {
        set $api http://api:8000;
        proxy_pass         $api/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    # SPA — serve index.html for all routes
    # No-cache on HTML so browsers always fetch fresh markup after a deploy
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }
}
