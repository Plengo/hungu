name: "Deploy · HUNGU App"

# ─────────────────────────────────────────────────────────────────────────────
# Triggers: any push to main that touches app code (not infra-only changes)
# Also runs manually and after the Terraform workflow creates/updates infra.
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - "services/web/**"
      - "services/worker/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}       # manual trigger
  workflow_run:               # auto-deploy after infra changes
    workflows: ["Terraform · Huawei Cloud"]
    types: [completed]
    branches: [main]

env:
  TF_WORKING_DIR: services/iaas
  OBS_BUCKET: hungu-tfstate
  OBS_KEY: hungu/terraform.tfstate
  OBS_REGION: af-south-1
  OBS_ENDPOINT: https://obs.af-south-1.myhuaweicloud.com

jobs:
  deploy:
    name: "Deploy to ECS"
    runs-on: ubuntu-latest
    environment: hungu
    # Skip if triggered by a failed Terraform run
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Get server IP from Terraform state ──────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"
          terraform_wrapper: false

      - name: Get server IP
        id: ip
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_hw_access_key: ${{ secrets.HW_ACCESS_KEY }}
          TF_VAR_hw_secret_key: ${{ secrets.HW_SECRET_KEY }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_worker_api_key: ${{ secrets.WORKER_API_KEY }}
          TF_VAR_admin_secret: ${{ secrets.ADMIN_SECRET }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          cat > /tmp/backend.hcl <<EOF
          bucket                      = "${{ env.OBS_BUCKET }}"
          key                         = "${{ env.OBS_KEY }}"
          region                      = "${{ env.OBS_REGION }}"
          access_key                  = "${{ secrets.HW_ACCESS_KEY }}"
          secret_key                  = "${{ secrets.HW_SECRET_KEY }}"
          skip_credentials_validation = true
          skip_metadata_api_check     = true
          skip_region_validation      = true
          skip_requesting_account_id  = true
          skip_s3_checksum            = true
          endpoints = {
            s3 = "${{ env.OBS_ENDPOINT }}"
          }
          EOF
          terraform init -backend-config=/tmp/backend.hcl
          PUBLIC_IP=$(terraform output -raw public_ip)
          echo "public_ip=$PUBLIC_IP" >> "$GITHUB_OUTPUT"
          echo "Server IP: $PUBLIC_IP"

      # ── Deploy via SSH ──────────────────────────────────────────────────
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        with:
          host: ${{ steps.ip.outputs.public_ip }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: "10m"
          envs: GH_TOKEN,GH_REPO
          script: |
            set -euo pipefail

            REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git"
            APP_DIR="/opt/hungu"

            # First deploy: cloud-init already created /opt/hungu with .env
            # git clone would fail on non-empty dir, so use init+pull instead
            if [ ! -d "$APP_DIR/.git" ]; then
              cd "$APP_DIR"
              git init
              git remote add origin "$REPO_URL"
              git fetch origin main
              git checkout -f main
            else
              cd "$APP_DIR"
              # Update remote URL with fresh token (previous token expired)
              git remote set-url origin "$REPO_URL"
              git pull --ff-only
            fi

            cd "$APP_DIR"

            # .env was written by Terraform cloud-init on first boot.
            if [ ! -f "$APP_DIR/.env" ]; then
              echo "ERROR: .env not found — cloud-init may still be running."
              exit 1
            fi

            # Rebuild and restart containers
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              up -d --build --remove-orphans

            echo "Deploy complete. App should be live at http://${{ steps.ip.outputs.public_ip }}"
