name: "Deploy · HUNGU App"

# ─────────────────────────────────────────────────────────────────────────────
# DEPRECATED — deployment is now fully handled by the Terraform workflow.
#
# On every push to main, terraform.yml runs `terraform apply` which triggers
# null_resource "update_env". That resource:
#   1. Writes .env (all secrets) to the server
#   2. git pull --ff-only (latest code)
#   3. sed injects GMAPS_API_KEY into index.html
#   4. docker compose up -d --build --remove-orphans (full rebuild & restart)
#
# This file is kept as a manual escape hatch only (workflow_dispatch).
# ─────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deploy"
        required: false
        default: "manual"

jobs:
  notice:
    name: "Deployment is handled by Terraform"
    runs-on: ubuntu-latest
    steps:
      - name: Info
        run: |
          echo "Deployment is fully managed by the Terraform workflow (terraform.yml)."
          echo "On every push to main, terraform apply runs null_resource update_env which:"
          echo "  1. Writes .env to the server"
          echo "  2. git pull --ff-only"
          echo "  3. Injects GMAPS_API_KEY into index.html"
          echo "  4. docker compose up -d --build --remove-orphans"
          echo "Reason for this manual trigger: ${{ github.event.inputs.reason }}"
