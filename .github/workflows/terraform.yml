name: "Terraform · Huawei Cloud"

# ─────────────────────────────────────────────────────────────────────────────
# Triggers
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
    paths:
      - "services/iaas/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/iaas/**"
  workflow_dispatch:
    inputs:
      tf_action:
        description: "Terraform action (plan | apply | destroy)"
        required: true
        default: "plan"
        type: choice
        options: [plan, apply, destroy]

# ─────────────────────────────────────────────────────────────────────────────
# Required GitHub Secrets
# (Settings → Secrets and variables → Actions → New repository secret)
#
#  HW_ACCESS_KEY    Huawei Cloud Access Key (AK)
#  HW_SECRET_KEY    Huawei Cloud Secret Key (SK)
#  DB_PASSWORD      RDS PostgreSQL password
#  DB_USERNAME      RDS PostgreSQL username (e.g. hungu)
#  GEMINI_API_KEY   Google Gemini API key
#  JWT_SECRET       Random 32-byte hex string  (openssl rand -hex 32)
#  WORKER_API_KEY   Shared secret worker→API   (openssl rand -hex 16)
#  SSH_PUBLIC_KEY   Contents of ~/.ssh/id_rsa.pub
#  SSH_PRIVATE_KEY  Contents of ~/.ssh/id_rsa
# ─────────────────────────────────────────────────────────────────────────────

env:
  TF_WORKING_DIR: services/iaas
  # OBS bucket must exist before first apply — create it manually in Huawei Console
  OBS_BUCKET: hungu-tfstate
  OBS_KEY: hungu/terraform.tfstate
  OBS_REGION: af-south-1
  OBS_ENDPOINT: https://obs.af-south-1.myhuaweicloud.com

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1: Terraform plan / apply / destroy
  # ───────────────────────────────────────────────────────────────────────────
  terraform:
    name: "Terraform (${{ github.event.inputs.tf_action || 'auto' }})"
    runs-on: ubuntu-latest
    environment: hungu
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    outputs:
      public_ip: ${{ steps.outputs.outputs.public_ip }}
      apply_ran: ${{ steps.apply.outputs.ran }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"
          terraform_wrapper: false   # needed so we can capture `terraform output`

      - name: Terraform Init (OBS remote state)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.HW_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HW_SECRET_KEY }}
        run: |
          terraform init \
            -backend-config="bucket=${{ env.OBS_BUCKET }}" \
            -backend-config="key=${{ env.OBS_KEY }}" \
            -backend-config="region=${{ env.OBS_REGION }}" \
            -backend-config="endpoint=${{ env.OBS_ENDPOINT }}" \
            -backend-config="access_key=${{ secrets.HW_ACCESS_KEY }}" \
            -backend-config="secret_key=${{ secrets.HW_SECRET_KEY }}" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="force_path_style=true"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: true   # warn only — don't fail the pipeline

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        env:
          TF_VAR_hw_access_key: ${{ secrets.HW_ACCESS_KEY }}
          TF_VAR_hw_secret_key: ${{ secrets.HW_SECRET_KEY }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_worker_api_key: ${{ secrets.WORKER_API_KEY }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        id: apply
        if: |
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event.inputs.tf_action == 'apply')
        env:
          TF_VAR_hw_access_key: ${{ secrets.HW_ACCESS_KEY }}
          TF_VAR_hw_secret_key: ${{ secrets.HW_SECRET_KEY }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_worker_api_key: ${{ secrets.WORKER_API_KEY }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          terraform apply -auto-approve tfplan
          echo "ran=true" >> "$GITHUB_OUTPUT"

      - name: Terraform Destroy
        if: github.event.inputs.tf_action == 'destroy'
        env:
          TF_VAR_hw_access_key: ${{ secrets.HW_ACCESS_KEY }}
          TF_VAR_hw_secret_key: ${{ secrets.HW_SECRET_KEY }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_worker_api_key: ${{ secrets.WORKER_API_KEY }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
        run: terraform destroy -auto-approve

      - name: Capture outputs
        id: outputs
        if: steps.apply.outputs.ran == 'true'
        run: |
          PUBLIC_IP=$(terraform output -raw public_ip)
          echo "public_ip=$PUBLIC_IP" >> "$GITHUB_OUTPUT"

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2: Deploy app via SSH (runs only after a successful apply)
  # ───────────────────────────────────────────────────────────────────────────
  deploy-app:
    name: "Deploy app to ECS"
    needs: terraform
    runs-on: ubuntu-latest
    environment: hungu
    if: needs.terraform.outputs.apply_ran == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for cloud-init to finish
        # The ECS startup script (cloud-init) can take ~90 s on first boot.
        # On subsequent deploys this sleep is a no-op effectively.
        run: sleep 90

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ needs.terraform.outputs.public_ip }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: "10m"
          script: |
            set -euo pipefail

            REPO_URL="https://github.com/${{ github.repository }}.git"
            APP_DIR="/opt/hungu"

            # Clone on first deploy; pull on subsequent ones
            if [ ! -d "$APP_DIR/.git" ]; then
              sudo git clone "$REPO_URL" "$APP_DIR"
            else
              cd "$APP_DIR" && sudo git pull --ff-only
            fi

            cd "$APP_DIR"

            # .env was written by Terraform cloud-init on first boot.
            # If it somehow doesn't exist yet, bail with a clear message.
            if [ ! -f "$APP_DIR/.env" ]; then
              echo "ERROR: .env not found at $APP_DIR/.env"
              echo "cloud-init may still be running — wait a minute and re-run the workflow."
              exit 1
            fi

            # Pull latest images and (re)start containers
            sudo docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              up -d --build --remove-orphans

            echo "Deploy complete. App should be live at https://hungu.co.za"
