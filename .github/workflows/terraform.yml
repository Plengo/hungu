name: "Terraform · Huawei Cloud"

# ─────────────────────────────────────────────────────────────────────────────
# Triggers
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/iaas/**"
  workflow_dispatch:
    inputs:
      tf_action:
        description: "Terraform action (plan | apply | destroy)"
        required: true
        default: "plan"
        type: choice
        options: [plan, apply, destroy]

# ─────────────────────────────────────────────────────────────────────────────
# Required GitHub Secrets
# (Settings → Secrets and variables → Actions → New repository secret)
#
#  HW_ACCESS_KEY    Huawei Cloud Access Key (AK)
#  HW_SECRET_KEY    Huawei Cloud Secret Key (SK)
#  DB_PASSWORD      PostgreSQL password (Docker container)
#  DB_USERNAME      PostgreSQL username (e.g. hungu)
#  GEMINI_API_KEY   Google Gemini API key
#  JWT_SECRET       Random 32-byte hex string  (openssl rand -hex 32)
#  WORKER_API_KEY   Shared secret worker→API   (openssl rand -hex 16)
#  ADMIN_SECRET     Admin dashboard key
#  SSH_PUBLIC_KEY   Contents of ~/.ssh/hungu_rsa.pub
#  SSH_PRIVATE_KEY  Contents of ~/.ssh/hungu_rsa
# ─────────────────────────────────────────────────────────────────────────────

env:
  TF_WORKING_DIR: services/iaas
  # OBS bucket must exist before first apply — create it manually in Huawei Console
  OBS_BUCKET: hungu-tfstate
  OBS_KEY: hungu/terraform.tfstate
  OBS_REGION: af-south-1
  OBS_ENDPOINT: https://obs.af-south-1.myhuaweicloud.com

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1: Terraform plan / apply / destroy
  # ───────────────────────────────────────────────────────────────────────────
  terraform:
    name: "Terraform (${{ github.event.inputs.tf_action || 'auto' }})"
    runs-on: ubuntu-latest
    environment: hungu
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    outputs:
      public_ip: ${{ steps.outputs.outputs.public_ip }}
      apply_ran: ${{ steps.apply.outputs.ran }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"
          terraform_wrapper: false   # needed so we can capture `terraform output`

      - name: Terraform Init (OBS remote state)
        run: |
          cat > /tmp/backend.hcl <<EOF
          bucket                      = "${{ env.OBS_BUCKET }}"
          key                         = "${{ env.OBS_KEY }}"
          region                      = "${{ env.OBS_REGION }}"
          access_key                  = "${{ secrets.HW_ACCESS_KEY }}"
          secret_key                  = "${{ secrets.HW_SECRET_KEY }}"
          skip_credentials_validation = true
          skip_metadata_api_check     = true
          skip_region_validation      = true
          skip_requesting_account_id  = true
          skip_s3_checksum            = true

          endpoints = {
            s3 = "${{ env.OBS_ENDPOINT }}"
          }
          EOF

          terraform init -backend-config=/tmp/backend.hcl

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: true   # warn only — don't fail the pipeline

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        env:
          TF_VAR_hw_access_key: ${{ secrets.HW_ACCESS_KEY }}
          TF_VAR_hw_secret_key: ${{ secrets.HW_SECRET_KEY }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_worker_api_key: ${{ secrets.WORKER_API_KEY }}
          TF_VAR_admin_secret: ${{ secrets.ADMIN_SECRET }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          TF_VAR_gmaps_api_key: ${{ secrets.GMAPS_API }}
          TF_VAR_git_sha: ${{ github.sha }}
          TF_VAR_github_token: ${{ github.token }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        id: apply
        if: |
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event.inputs.tf_action == 'apply')
        env:
          TF_VAR_hw_access_key: ${{ secrets.HW_ACCESS_KEY }}
          TF_VAR_hw_secret_key: ${{ secrets.HW_SECRET_KEY }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_worker_api_key: ${{ secrets.WORKER_API_KEY }}
          TF_VAR_admin_secret: ${{ secrets.ADMIN_SECRET }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          TF_VAR_gmaps_api_key: ${{ secrets.GMAPS_API }}
          TF_VAR_git_sha: ${{ github.sha }}
          TF_VAR_github_token: ${{ github.token }}
        run: |
          terraform apply -auto-approve tfplan
          echo "ran=true" >> "$GITHUB_OUTPUT"

      - name: Terraform Destroy
        if: github.event.inputs.tf_action == 'destroy'
        env:
          TF_VAR_hw_access_key: ${{ secrets.HW_ACCESS_KEY }}
          TF_VAR_hw_secret_key: ${{ secrets.HW_SECRET_KEY }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_worker_api_key: ${{ secrets.WORKER_API_KEY }}
          TF_VAR_admin_secret: ${{ secrets.ADMIN_SECRET }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          TF_VAR_gmaps_api_key: ${{ secrets.GMAPS_API }}
          TF_VAR_git_sha: ${{ github.sha }}
          TF_VAR_github_token: ${{ github.token }}
        run: terraform destroy -auto-approve

      - name: Capture outputs
        id: outputs
        if: steps.apply.outputs.ran == 'true'
        run: |
          PUBLIC_IP=$(terraform output -raw public_ip)
          echo "public_ip=$PUBLIC_IP" >> "$GITHUB_OUTPUT"
          echo "### 🚀 Infrastructure Ready" >> "$GITHUB_STEP_SUMMARY"
          echo "Server IP: \`$PUBLIC_IP\`" >> "$GITHUB_STEP_SUMMARY"
          echo "SSH: \`ssh ubuntu@$PUBLIC_IP\`" >> "$GITHUB_STEP_SUMMARY"
