name: "Deploy · Axxess VPS"

# ─────────────────────────────────────────────────────────────────────────────
# Triggers
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/deploy/**"
  workflow_dispatch:
    inputs:
      tf_action:
        description: "Terraform action (plan | apply | destroy)"
        required: true
        default: "plan"
        type: choice
        options: [plan, apply, destroy]

# ─────────────────────────────────────────────────────────────────────────────
# Required GitHub Secrets
# (Settings → Secrets and variables → Actions → New repository secret)
#
#  SSH_PRIVATE_KEY     Contents of ~/.ssh/hungu_rsa  (deploy key with write access)
#  DB_PASSWORD         PostgreSQL password
#  DB_USERNAME         PostgreSQL username (e.g. hungu)
#  JWT_SECRET          Random 32-byte hex string  (openssl rand -hex 32)
#  WORKER_API_KEY      Shared secret worker→API   (openssl rand -hex 16)
#  ADMIN_SECRET        Admin dashboard key
#  GEMINI_API_KEY      Google Gemini API key
#  GMAPS_API           Google Maps JavaScript API key
#  GROQ_API_KEY        Groq API key
#  MISTRAL_API_KEY     Mistral API key
#  OPENROUTER_API_KEY  OpenRouter API key
#  CEREBRAS_API_KEY    Cerebras API key
#  SAMBANOVA_API_KEY   SambaNova API key
#  KIMI_API_KEY        Kimi API key
#  DEEPSEEK_API_KEY    DeepSeek API key
#  GOOGLE_CLIENT_ID    Google OAuth client ID
# ─────────────────────────────────────────────────────────────────────────────

env:
  TF_WORKING_DIR: services/deploy

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1: Terraform plan / apply / destroy
  # ───────────────────────────────────────────────────────────────────────────
  terraform:
    name: "Terraform (${{ github.event.inputs.tf_action || 'auto' }})"
    runs-on: ubuntu-latest
    environment: hungu
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    outputs:
      apply_ran: ${{ steps.apply.outputs.ran }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"
          terraform_wrapper: false   # needed so we can capture `terraform output`

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: true   # warn only — don't fail the pipeline

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        env:
          TF_VAR_ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          TF_VAR_github_token: ${{ github.token }}
          TF_VAR_git_sha: ${{ github.sha }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_worker_api_key: ${{ secrets.WORKER_API_KEY }}
          TF_VAR_admin_secret: ${{ secrets.ADMIN_SECRET }}
          TF_VAR_gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          TF_VAR_gmaps_api_key: ${{ secrets.GMAPS_API }}
          TF_VAR_groq_api_key: ${{ secrets.GROQ_API_KEY }}
          TF_VAR_mistral_api_key: ${{ secrets.MISTRAL_API_KEY }}
          TF_VAR_openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          TF_VAR_cerebras_api_key: ${{ secrets.CEREBRAS_API_KEY }}
          TF_VAR_sambanova_api_key: ${{ secrets.SAMBANOVA_API_KEY }}
          TF_VAR_kimi_api_key: ${{ secrets.KIMI_API_KEY }}
          TF_VAR_deepseek_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
          TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        id: apply
        if: |
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event.inputs.tf_action == 'apply')
        env:
          TF_VAR_ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          TF_VAR_github_token: ${{ github.token }}
          TF_VAR_git_sha: ${{ github.sha }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_worker_api_key: ${{ secrets.WORKER_API_KEY }}
          TF_VAR_admin_secret: ${{ secrets.ADMIN_SECRET }}
          TF_VAR_gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          TF_VAR_gmaps_api_key: ${{ secrets.GMAPS_API }}
          TF_VAR_groq_api_key: ${{ secrets.GROQ_API_KEY }}
          TF_VAR_mistral_api_key: ${{ secrets.MISTRAL_API_KEY }}
          TF_VAR_openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          TF_VAR_cerebras_api_key: ${{ secrets.CEREBRAS_API_KEY }}
          TF_VAR_sambanova_api_key: ${{ secrets.SAMBANOVA_API_KEY }}
          TF_VAR_kimi_api_key: ${{ secrets.KIMI_API_KEY }}
          TF_VAR_deepseek_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
          TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          terraform apply -auto-approve tfplan
          echo "ran=true" >> "$GITHUB_OUTPUT"

      - name: Terraform Destroy
        if: github.event.inputs.tf_action == 'destroy'
        env:
          TF_VAR_ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          TF_VAR_github_token: ${{ github.token }}
          TF_VAR_git_sha: ${{ github.sha }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_worker_api_key: ${{ secrets.WORKER_API_KEY }}
          TF_VAR_admin_secret: ${{ secrets.ADMIN_SECRET }}
          TF_VAR_gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          TF_VAR_gmaps_api_key: ${{ secrets.GMAPS_API }}
          TF_VAR_groq_api_key: ${{ secrets.GROQ_API_KEY }}
          TF_VAR_mistral_api_key: ${{ secrets.MISTRAL_API_KEY }}
          TF_VAR_openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          TF_VAR_cerebras_api_key: ${{ secrets.CEREBRAS_API_KEY }}
          TF_VAR_sambanova_api_key: ${{ secrets.SAMBANOVA_API_KEY }}
          TF_VAR_kimi_api_key: ${{ secrets.KIMI_API_KEY }}
          TF_VAR_deepseek_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
          TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: terraform destroy -auto-approve

      - name: Deployment summary
        if: steps.apply.outputs.ran == 'true'
        run: |
          echo "### Deployed to Axxess VPS" >> "$GITHUB_STEP_SUMMARY"
          echo "Server: \`156.155.250.65\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
