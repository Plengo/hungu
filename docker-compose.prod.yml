# docker-compose.prod.yml — Production override
# Merges with docker-compose.yml to run HUNGU on the Huawei Cloud ECS.
#
# Key differences from dev:
#   - db service is disabled (uses Huawei RDS PostgreSQL instead)
#   - All services have restart: always
#   - Environment variables are injected at runtime from .env
#
# Usage (on the ECS server):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

version: '3.8'

services:
  web:
    restart: always
    ports:
      - "80:80"

  api:
    restart: always
    environment:
      - DB_URL=${DB_URL}
      - JWT_SECRET=${JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    # Remove the local db dependency — RDS is always available
    depends_on: []

  worker:
    restart: always
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - API_BASE_URL=http://api:8000
      - SCRAPE_INTERVAL_SECS=${SCRAPE_INTERVAL_SECS:-3600}
    depends_on:
      - api

  # Disable the local PostgreSQL container — Huawei RDS is used instead.
  # Saves ~200 MB RAM on the free-tier ECS (1 GB total).
  db:
    deploy:
      replicas: 0
