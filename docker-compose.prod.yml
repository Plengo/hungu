# docker-compose.prod.yml — Production override
# Merges with docker-compose.yml to run HUNGU on the Huawei Cloud ECS.
#
# Key differences from dev:
#   - All services have restart: always
#   - Web binds to port 80 and 443
#   - SSL certs and certbot webroot mounted into nginx
#   - Environment variables are injected at runtime from .env
#
# Usage (on the ECS server):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

version: '3.8'

services:
  web:
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro

  api:
    restart: always
    environment:
      - DB_URL=${DB_URL}
      - JWT_SECRET=${JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - WORKER_API_KEY=${WORKER_API_KEY}
      - ADMIN_SECRET=${ADMIN_SECRET}

  worker:
    restart: always
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY:-}
      - SAMBANOVA_API_KEY=${SAMBANOVA_API_KEY:-}
      - API_BASE_URL=http://api:8000
      - WORKER_API_KEY=${WORKER_API_KEY}
      - SCRAPE_INTERVAL_SECS=${SCRAPE_INTERVAL_SECS:-3600}
    depends_on:
      - api

  db:
    restart: always
