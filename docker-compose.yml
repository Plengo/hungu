version: '3.8'

services:
  web:
    build: ./services/web
    ports:
      - "3000:80"
    networks:
      - hungu-net
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: ./services/api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DB_URL=${DB_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - WORKER_API_KEY=${WORKER_API_KEY}
      - ADMIN_SECRET=${ADMIN_SECRET}
    networks:
      - hungu-net
    depends_on:
      - db
    restart: unless-stopped

  worker:
    build: ./services/worker
    env_file: .env
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY:-}
      - SAMBANOVA_API_KEY=${SAMBANOVA_API_KEY:-}
      - API_BASE_URL=http://api:8000
      - WORKER_API_KEY=${WORKER_API_KEY}
    networks:
      - hungu-net
    depends_on:
      - api
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=hungu
      - POSTGRES_USER=hungu
      - POSTGRES_PASSWORD=${DB_PASSWORD:-hungu_secret}
    volumes:
      - hungu-db-data:/var/lib/postgresql/data
    networks:
      - hungu-net
    # DB is NOT exposed to the host — internal only (security)
    restart: unless-stopped

networks:
  hungu-net:
    driver: bridge

volumes:
  hungu-db-data:
